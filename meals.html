<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食抽签小程序 - 预览版</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --gold: #f0c060;
            --text: #e0e0e0;
            --text-light: #b0b0b0;
            --border: #2a2a4a;
            --btn-bg: #e94560;
            --btn-hover: #c0392b;
            --tag-chinese: #e74c3c;
            --tag-western: #3498db;
            --tag-japanese: #e67e22;
            --tag-korean: #9b59b6;
            --tag-seasian: #1abc9c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at top, rgba(233, 68, 96, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at bottom, rgba(240, 192, 96, 0.06) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 32px;
            padding: 20px 16px 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 2px var(--border),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            min-height: 700px;
            display: flex;
            flex-direction: column;
        }

        /* Notch */
        .notch {
            width: 100px;
            height: 6px;
            background: #0d0d1a;
            border-radius: 20px;
            margin: 0 auto 16px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header .icon-row {
            font-size: 40px;
            margin-bottom: 4px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }
        .header .subtitle {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* Language Switcher */
        .lang-switch {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-light);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            white-space: nowrap;
        }
        .lang-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(233, 68, 96, 0.35);
        }
        .lang-btn:hover {
            border-color: var(--accent);
            color: #fff;
        }

        /* Card Area */
        .card-container {
            flex: 1;
            perspective: 1000px;
            margin-bottom: 16px;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 340px;
            min-height: 320px;
            background: linear-gradient(145deg, #1e2a4a 0%, #1a1f35 100%);
            border-radius: 24px;
            padding: 24px 20px;
            border: 1.5px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        .card.spinning {
            animation: cardSpin 0.6s ease-in-out;
        }
        @keyframes cardSpin {
            0% {
                transform: rotateY(0) scale(1);
            }
            30% {
                transform: rotateY(180deg) scale(0.9);
            }
            60% {
                transform: rotateY(360deg) scale(0.95);
            }
            100% {
                transform: rotateY(360deg) scale(1);
            }
        }
        .card.reveal {
            animation: revealGlow 0.8s ease-out;
        }
        @keyframes revealGlow {
            0% {
                box-shadow: 0 10px 40px rgba(233, 68, 96, 0.6);
            }
            50% {
                box-shadow: 0 10px 60px rgba(240, 192, 96, 0.8);
            }
            100% {
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            }
        }

        /* Card sparkle overlay */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.03), transparent, rgba(255, 255, 255, 0.02), transparent);
            animation: shimmer 4s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }
        @keyframes shimmer {
            to {
                transform: rotate(360deg);
            }
        }

        .card .emoji-big {
            font-size: 60px;
            text-align: center;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            animation: bounceIn 0.5s ease-out;
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .card .category-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0 auto 8px;
            position: relative;
            z-index: 1;
        }
        .tag-chinese {
            background: rgba(231, 76, 60, 0.25);
            color: #f8716b;
        }
        .tag-western {
            background: rgba(52, 152, 219, 0.25);
            color: #60a5fa;
        }
        .tag-japanese {
            background: rgba(230, 126, 34, 0.25);
            color: #fbbf6e;
        }
        .tag-korean {
            background: rgba(155, 89, 182, 0.25);
            color: #c084fc;
        }
        .tag-seasian {
            background: rgba(26, 188, 156, 0.25);
            color: #34d399;
        }

        .card .dish-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
            letter-spacing: 1px;
        }
        .card .section-title {
            font-size: 12px;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 10px 0 4px;
            position: relative;
            z-index: 1;
        }
        .card .content-text {
            font-size: 13px;
            color: var(--text);
            line-height: 1.6;
            position: relative;
            z-index: 1;
            max-height: 115px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .card .content-text::-webkit-scrollbar {
            width: 3px;
        }
        .card .content-text::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Placeholder state */
        .card.placeholder .emoji-big {
            font-size: 70px;
            opacity: 0.7;
        }
        .card.placeholder .dish-name {
            color: var(--text-light);
            font-size: 16px;
        }

        /* Button */
        .btn-main {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
            padding: 16px 28px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #e94560 0%, #c0392b 100%);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(233, 68, 96, 0.4);
            position: relative;
            overflow: hidden;
        }
        .btn-main:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(233, 68, 96, 0.55);
        }
        .btn-main:active {
            transform: scale(0.96);
            transition: all 0.1s;
        }
        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-main .btn-icon {
            margin-right: 6px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 440px) {
            .phone-frame {
                border-radius: 20px;
                padding: 14px 10px 20px;
            }
            .card {
                min-height: 280px;
                padding: 18px 14px;
            }
            .card .dish-name {
                font-size: 19px;
            }
            .card .content-text {
                font-size: 12px;
                max-height: 100px;
            }
            .btn-main {
                font-size: 15px;
                padding: 14px 22px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="notch"></div>

        <!-- Header -->

            <div class="icon-row">🍽️</div>
            <h1>美食抽签</h1>

            <button class="lang-btn" data-lang="en" onclick="switchLang('en')">🇬🇧 English</button>

        <!-- Card -->
        <div class="card-container">
            <div class="card placeholder" id="dishCard">

                <div class="content-text" id="cardSteps">点击按钮随机抽取一道菜品</div>

        <!-- Button -->
        <button class="btn-main" id="drawBtn" onclick="drawDish()">

    </div>

        // ==================== 函数 ====================
        function getCategoryClass(category) {
            const map = {
                chinese: 'tag-chinese',
                western: 'tag-western',
                japanese: 'tag-japanese',
                korean: 'tag-korean',
                seasian: 'tag-seasian'
            };
            return map[category] || 'tag-chinese';
        }

        function getCategoryName(category) {
            return i18nDict[currentLang].categoryNames[category] || category;
        }

        function getI18nField(dish, fieldBase) {
            const key = fieldBase + '_' + currentLang;
            const fallbackKey = fieldBase + '_zh';
            return dish[key] || dish[fallbackKey] || '';
        }

        function updateCard(dish) {
            const card = document.getElementById('dishCard');
            const nameEl = document.getElementById('cardDishName');
            const catEl = document.getElementById('cardCategory');
            const ingLabel = document.getElementById('cardIngredientsLabel');
            const ingEl = document.getElementById('cardIngredients');
            const stepLabel = document.getElementById('cardStepsLabel');
            const stepEl = document.getElementById('cardSteps');

            card.classList.remove('placeholder', 'spinning', 'reveal');

            if (dish) {
                const name = getI18nField(dish, 'name');
                const ingredients = getI18nField(dish, 'ingredients');
                const steps = getI18nField(dish, 'steps');
                const category = getCategoryName(dish.category);

                card.querySelector('.emoji-big').textContent = dish.emoji;
                nameEl.textContent = name;
                catEl.textContent = category;
                catEl.className = 'category-tag ' + getCategoryClass(dish.category);
                ingLabel.textContent = i18nDict[currentLang].ingredientsLabel;
                ingEl.textContent = ingredients;
                stepLabel.textContent = i18nDict[currentLang].stepsLabel;
                stepEl.textContent = steps;

                // Trigger reveal animation
                void card.offsetWidth;
                card.classList.add('reveal');
            } else {
                // Placeholder
                card.querySelector('.emoji-big').textContent = '🎴';
                nameEl.textContent = i18nDict[currentLang].placeholderName;
                catEl.textContent = '---';
                catEl.className = 'category-tag tag-chinese';
                ingLabel.textContent = i18nDict[currentLang].ingredientsLabel;
                ingEl.textContent = i18nDict[currentLang].placeholderIngredients;
                stepLabel.textContent = i18nDict[currentLang].stepsLabel;
                stepEl.textContent = i18nDict[currentLang].placeholderSteps;
                card.classList.add('placeholder');
            }
        }

        function drawDish() {
            if (isDrawing) return;
            isDrawing = true;

            const btn = document.getElementById('drawBtn');
            const card = document.getElementById('cardDish');

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-icon">🎰</span> ' + i18nDict[currentLang].drawing;

            // Spin animation
            card.classList.add('spinning');

            // Random selection after spin animation timing
            const randomIndex = Math.floor(Math.random() * dishesDB.length);
            const selectedDish = dishesDB[randomIndex];

            setTimeout(() => {
                updateCard(selectedDish);
                card.classList.remove('spinning');
                card.classList.add('reveal');

                btn.disabled = false;
                btn.innerHTML = '<span class="btn-icon">🎲</span> ' + i18nDict[currentLang].drawBtn;

                showToast(i18nDict[currentLang].toastDrawn);
                isDrawing = false;
            }, 600);
        }

        function switchLang(lang) {
            currentLang = lang;

            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Re-render current card or placeholder
            const card = document.getElementById('dishCard');
            const nameEl = document.getElementById('cardDishName');
            const currentDishId = card.dataset.dishId;

            if (currentDishId && !card.classList.contains('placeholder')) {
                const dish = dishesDB.find(d => d.id === parseInt(currentDishId));
                if (dish) updateCard(dish);
            } else {
                updateCard(null);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 1800);
        }

        // ==================== Initialize ====================
        function init() {
            updateCard(null);
            // Store dish ID on card for re-rendering after language switch
            const card = document.getElementById('dishCard');
            const originalUpdateCard = updateCard;
            updateCard = function(dish) {
                if (dish) {
                    card.dataset.dishId = dish.id;
                } else {
                    card.dataset.dishId = '';
                }
                originalUpdateCard(dish);
            };
        }

        init();

        console.log('🍽️ 美食抽签小程序已就绪！');
        console.log('📊 共加载 ' + dishesDB.length + ' 道菜品');
        console.log('🌐 支持语言: 普通话 | 粤语 | English');
        console.log('👆 点击按钮开始抽签吧！');
    </script>
